name: Import signed OpenWrt packaging change
on:
  push:
    branches: [bootstrap/ledger-openwrt]
    paths: [.bootstrap/offload-install.bundle.b64, .github/workflows/test.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and import exact candidate
        run: |
          base64 -d .bootstrap/offload-install.bundle.b64 > /tmp/ledger.bundle
          echo 'f70904624b91ca199f38445fd639f0c8ce389f67989226677a197df5a178b718  /tmp/ledger.bundle' | sha256sum -c -
          git bundle verify /tmp/ledger.bundle
          git fetch /tmp/ledger.bundle HEAD:refs/heads/candidate
          test "$(git rev-parse candidate)" = c9cd56193e0a7cf5e402ee2311a651d43f8acb85
          test "$(git rev-parse candidate^{tree})" = 2ef823878c5a8906b849aef3a676ec4f7f9db89c
          git log -1 --format=%B candidate | grep -Fx 'Signed-off-by: Yuen Su <zypulsecore@gmail.com>'
          git diff --check c1714f85b0d875df5ea5479abbad3bbb4e7d8ca6 candidate
      - name: Publish staging ref for checked external main update
        run: git push origin candidate:refs/heads/imported/ledger-openwrt
