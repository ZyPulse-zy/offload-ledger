name: Import standalone policy source
on:
  push:
    branches: [bootstrap/import]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify source bundle and identity
        run: |
          base64 -d .bootstrap/source.bundle.b64 > /tmp/source.bundle
          echo '2bcce96af9c439732674c316b9c49412a20166b42c66a41146f17c3eb1637987  /tmp/source.bundle' | sha256sum -c -
          git fetch /tmp/source.bundle main:refs/remotes/import/main
          test "$(git rev-parse refs/remotes/import/main)" = 4112882d1feb86e05ae26c9dc7ebf931bd36434b
          git checkout --detach refs/remotes/import/main
      - run: sudo apt-get update -qq && sudo apt-get install -y lua5.1 lua-cjson
      - run: make LUA=lua5.1 test test-json example
      - name: Transfer verified source objects
        continue-on-error: true
        run: git push --force-with-lease=refs/heads/main:e2d26feec695c7100483c141097496e7aa6e79f8 origin HEAD:refs/heads/main
